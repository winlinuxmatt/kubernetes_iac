# Longhorn values for Talos with Cilium CNI
defaultSettings:
  # Disable default filesystem-based disk creation
  createDefaultDisk: false

  # Optional: set default replica count (can be overridden per volume)
  defaultReplicaCount: 3

  # Optional: enable auto-cleanup of unreferenced resources
  autoDeletePodWhenPvDrainFailed: true

  # Cilium CNI specific settings
  csi.kubeletRootDir: "/var/lib/kubelet"
  
  # Enable backup target (optional)
  backupTarget: ""

  # Network settings for Cilium
  network:
    # Use Cilium's network policies
    allowNodeDrainSameNetworkZone: true

  # Talos-specific settings
  disableScheduling: false
  allowRecurringJobWhileVolumeDetached: true

# Persistence settings:
# (You can add disks manually in the UI after install)
persistence:
  # Configure default filesystem and storage class settings.
  # You can add disks manually in UI.
  defaultFs: xfs
  defaultClass: true

# Optional: node selector to run Longhorn only on workers
# nodeSelector:
#   node-role.kubernetes.io/worker: "true"

# Optional: tolerations for worker-only nodes
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

# Explicitly clear nodeSelector so Longhorn runs on all nodes
nodeSelector: {}

# Expose Longhorn UI via NodePort for external access
service:
  ui:
    type: NodePort
    nodePort: 30080  # Choose a port in the NodePort range (30000-32767)

# Optional: Enable access to Longhorn Manager API
longhornManager:
  service:
    type: ClusterIP
